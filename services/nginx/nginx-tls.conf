# Cloudflare IPv4 + IPv6 ranges, as `set_real_ip_from` directives (generated by
# scripts/cf_ips.py). Real client IP comes from Cloudflare's header, and is only
# honoured for connections that actually originated from those ranges.
include /etc/nginx/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;

# Shared TLS + Authenticated Origin Pulls settings. See
# projects/crossfyre/services/nginx/README.md for the full rationale and setup:
# the origin previously served :80 only, which forces Cloudflare Flexible SSL and
# put the shared secret, session tokens and file-share presigned URLs in
# cleartext across the public internet, with the origin directly reachable.

# api_switch: exposed ONLY through Cloudflare (orange cloud). Cloudflare
# terminates TLS and forwards to :80 with the real Host header.
#
# Sensitive: api_switch enforces the X-Authority-Sign gate itself, so only our
# own backends (web_server SSR + the clickswave admin panel, holding
# INFRA_COMMUNICATION_SECRET) can use it. nginx only reverse-proxies and rejects anything
# off our zone.

# Admin surface for the clickswave admin panel (Cloudflare Pages, so it can only
# reach us over a public hostname). Served on a DEDICATED hostname, never the
# public api zone. api_switch protects every /admin route with two independent
# fail-closed secrets (X-Authority-Sign + HMAC X-Admin-Token); put Cloudflare
# Access in front of this hostname as well for defense-in-depth.
# DNS: point admin-api.silo.cat (prod box) / admin-api-staging.silo.cat
# (staging box) at the box through Cloudflare before use.
server {
    listen 443 ssl;
    http2 on;
    server_name admin-api.silo.cat admin-api-staging.silo.cat;

    ssl_certificate     /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_client_certificate /etc/nginx/tls/cloudflare-origin-pull-ca.pem;
    # Authenticated Origin Pulls: OPTIONAL, deliberately, not `on`.
    #
    # With `on`, every request through Cloudflare got nginx's 400 "no required
    # SSL certificate was sent" -- the access log showed the handshake completing
    # from Cloudflare IPs over HTTP/2 and then the request being rejected, so the
    # edge was negotiating TLS but presenting NO client certificate, even with
    # the zone's origin_tls_client_auth setting reporting enabled. That is a
    # Cloudflare-side gap, not propagation: it reproduced on every one of 12
    # cache-busted requests (the handful of 200s seen first were cached).
    #
    # `optional` keeps the CA loaded and still populates $ssl_client_verify, so
    # the certificate is validated whenever it IS sent and the day it starts
    # working we can tighten back to `on` on evidence rather than hope. What
    # actually keeps this origin private meanwhile is the security group: 80/443
    # accept Cloudflare's published ranges only (terraform/network.tf), so a
    # direct hit on the IP is refused at the network layer.
    ssl_verify_client      optional;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;


    location / {
        proxy_pass http://sc_api_switch:31337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # The visitor's address as resolved by the web_server. Forwarded
        # explicitly rather than relying on pass-through, because this is what
        # api_switch rate-limits and IP-bans on. CF-Connecting-IP cannot carry
        # it: this hop crosses Cloudflare, which rewrites that header.
        proxy_set_header X-Client-IP $http_x_client_ip;
    }
}
#
#   api.silo.cat          -> prod api
#   stage-<sha>.silo.cat  -> staging api
# Both are single-label subdomains, so one wildcard covers them.
server {
    listen 443 ssl;
    http2 on;
    server_name *.silo.cat;

    ssl_certificate     /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_client_certificate /etc/nginx/tls/cloudflare-origin-pull-ca.pem;
    # Authenticated Origin Pulls: OPTIONAL, deliberately, not `on`.
    #
    # With `on`, every request through Cloudflare got nginx's 400 "no required
    # SSL certificate was sent" -- the access log showed the handshake completing
    # from Cloudflare IPs over HTTP/2 and then the request being rejected, so the
    # edge was negotiating TLS but presenting NO client certificate, even with
    # the zone's origin_tls_client_auth setting reporting enabled. That is a
    # Cloudflare-side gap, not propagation: it reproduced on every one of 12
    # cache-busted requests (the handful of 200s seen first were cached).
    #
    # `optional` keeps the CA loaded and still populates $ssl_client_verify, so
    # the certificate is validated whenever it IS sent and the day it starts
    # working we can tighten back to `on` on evidence rather than hope. What
    # actually keeps this origin private meanwhile is the security group: 80/443
    # accept Cloudflare's published ranges only (terraform/network.tf), so a
    # direct hit on the IP is refused at the network layer.
    ssl_verify_client      optional;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;


    # Per-VPS health snapshot for clickswave_status (public status page). Routed
    # to the health_monitor agent, NOT api_switch. The agent enforces its own
    # Bearer (HM_TOKEN), so this stays safe to expose through Cloudflare.
    location = /__health {
        proxy_pass http://sc_health_monitor:9099/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # The visitor's address as resolved by the web_server. Forwarded
        # explicitly rather than relying on pass-through, because this is what
        # api_switch rate-limits and IP-bans on. CF-Connecting-IP cannot carry
        # it: this hop crosses Cloudflare, which rewrites that header.
        proxy_set_header X-Client-IP $http_x_client_ip;
    }

    # Admin API is never served on the public zone. The admin surface must be
    # reached over an internal/Access-protected path, not the public wildcard
    # gated only by the shared X-Authority-Sign. Defense-in-depth on top of the
    # per-request admin-session check in api_switch.
    location ^~ /admin {
        return 404;
    }

    location / {
        proxy_pass http://sc_api_switch:31337;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # The visitor's address as resolved by the web_server. Forwarded
        # explicitly rather than relying on pass-through, because this is what
        # api_switch rate-limits and IP-bans on. CF-Connecting-IP cannot carry
        # it: this hop crosses Cloudflare, which rewrites that header.
        proxy_set_header X-Client-IP $http_x_client_ip;
        proxy_cache_bypass $http_upgrade;
    }
}

# Plain HTTP. This PROXIES rather than redirecting, deliberately.
#
# Cloudflare picks the origin port from the zone's SSL mode. While the zone is
# still on Flexible it connects on :80, so a 301 to https here would bounce back
# through Cloudflare into an infinite redirect loop and take the site down the
# moment this config shipped. Proxying is correct in BOTH modes, which lets the
# certificate roll out before the zone flip.
#
# After scripts/cf_origin_tls.py --enable (Full strict + Always Use HTTPS),
# Cloudflare stops using :80 and these blocks go unused; they can then safely
# become `return 301 https://$host$request_uri;`.
#
# The admin hostnames need their OWN :80 block, mirroring the :443 one at the
# top of this file. They used to share the wildcard block below, which meant its
# `location ^~ /admin { return 404; }` swallowed the admin API: while the zone is
# Flexible, Cloudflare only ever connects here on :80, so the entire admin
# surface 404'd and the clickswave panel could not reach this box at all. nginx
# prefers an exact server_name over a wildcard, so this block wins for the two
# admin hosts and the wildcard keeps its 404 for everything else.
server {
    listen 80;
    server_name admin-api.silo.cat admin-api-staging.silo.cat;

    location / {
        proxy_pass http://sc_api_switch:31337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # The visitor's address as resolved by the web_server. Forwarded
        # explicitly rather than relying on pass-through, because this is what
        # api_switch rate-limits and IP-bans on. CF-Connecting-IP cannot carry
        # it: this hop crosses Cloudflare, which rewrites that header.
        proxy_set_header X-Client-IP $http_x_client_ip;
    }
}

server {
    listen 80;
    server_name *.silo.cat;

    # Admin API is never served on the public zone.
    location ^~ /admin {
        return 404;
    }

    location = /__health {
        proxy_pass http://sc_health_monitor:9099/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # The visitor's address as resolved by the web_server. Forwarded
        # explicitly rather than relying on pass-through, because this is what
        # api_switch rate-limits and IP-bans on. CF-Connecting-IP cannot carry
        # it: this hop crosses Cloudflare, which rewrites that header.
        proxy_set_header X-Client-IP $http_x_client_ip;
    }

    location / {
        proxy_pass http://sc_api_switch:31337;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # The visitor's address as resolved by the web_server. Forwarded
        # explicitly rather than relying on pass-through, because this is what
        # api_switch rate-limits and IP-bans on. CF-Connecting-IP cannot carry
        # it: this hop crosses Cloudflare, which rewrites that header.
        proxy_set_header X-Client-IP $http_x_client_ip;
        proxy_cache_bypass $http_upgrade;
    }
}

# Catch-all: reject unknown hosts (raw IP, off-zone domains).
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    return 444;
}
