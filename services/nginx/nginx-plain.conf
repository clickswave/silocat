# FALLBACK CONFIG - plaintext :80 only.
#
# Used automatically when no origin TLS material is present (see entrypoint.sh).
# This is the pre-hardening behaviour and carries finding C-1:
#   - Cloudflare must be on Flexible SSL, so the edge-to-origin hop crosses the
#     public internet UNENCRYPTED, carrying X-Authority-Sign, session JWTs and
#     the decrypted customer credentials returned by /creds/resolve
#   - the origin answers any request with a matching Host header, so anyone who
#     learns the IP bypasses Cloudflare WAF, rate limiting and Access
#
# Swap to nginx-tls.conf by installing the certificates; the entrypoint picks it
# up automatically. Do not treat this file as the target state.

# Cloudflare ranges are still honoured for real-client-IP, so the api_switch
# rate limiters key on the actual client even in this mode.
include /etc/nginx/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;

# Admin surface, on its own hostname. This block is what makes the clickswave
# admin panel able to reach this box: the wildcard block below deliberately 404s
# /admin so the admin API is never exposed on the public api hostname, and
# without an exact-match block here that 404 would apply to admin-api.* too.
# nginx prefers an exact server_name over a wildcard, so these two hosts land
# here and everything else falls through to the wildcard.
#
# /admin is still gated: api_switch requires X-Authority-Sign AND an HMAC
# X-Admin-Token, both fail-closed, and Cloudflare Access fronts the panel. What
# this block does NOT add is origin authentication, because in plaintext mode
# there is none for any hostname on this box (finding C-1) - that is fixed by
# installing origin certificates, not by 404ing the admin API.
server {
    listen 80;
    server_name admin-api.silo.cat admin-api-staging.silo.cat;

    location / {
        proxy_pass http://sc_api_switch:31337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # The visitor's address as resolved by the web_server. Forwarded
        # explicitly rather than relying on pass-through, because this is what
        # api_switch rate-limits and IP-bans on. CF-Connecting-IP cannot carry
        # it: this hop crosses Cloudflare, which rewrites that header.
        proxy_set_header X-Client-IP $http_x_client_ip;
    }
}

server {
    listen 80;
    server_name *.silo.cat;

    location = /__health {
        proxy_pass http://sc_health_monitor:9099/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # The visitor's address as resolved by the web_server. Forwarded
        # explicitly rather than relying on pass-through, because this is what
        # api_switch rate-limits and IP-bans on. CF-Connecting-IP cannot carry
        # it: this hop crosses Cloudflare, which rewrites that header.
        proxy_set_header X-Client-IP $http_x_client_ip;
    }

    # Admin API is never served on the public zone (see nginx-tls.conf).
    location ^~ /admin {
        return 404;
    }

    location / {
        proxy_pass http://sc_api_switch:31337;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # The visitor's address as resolved by the web_server. Forwarded
        # explicitly rather than relying on pass-through, because this is what
        # api_switch rate-limits and IP-bans on. CF-Connecting-IP cannot carry
        # it: this hop crosses Cloudflare, which rewrites that header.
        proxy_set_header X-Client-IP $http_x_client_ip;
        proxy_cache_bypass $http_upgrade;
    }
}

# Catch-all - reject unknown hosts.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
