[package]
name = "api_switch"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros"] }
axum = "0.8.8"
serde_json = "1.0.148"
serde = { version = "1.0.228", features = ["derive"] }
chrono = { version = "0.4.38", features = ["serde"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "postgres", "chrono", "macros", "bigdecimal", "json", "uuid"] }
tower-http = { version = "0.6.8", features = ["cors"] }
anyhow = { version = "1.0.100", features = [] }
regex = "1.12.2"
uuid = { version = "1.19.0", features = ["v4", "fast-rng"] }
email_address = { version = "0.2.9", features = [] }
aws-sdk-s3 = "1.104.0"
aws-smithy-types = "1.3.2"
aws-config = "1.8.6"
rand_core = "0.10.0-rc-3"
argon2 = { version = "0.5.3", features = [] }
rand = { version = "0.8.5", features = [] }
lettre = { version = "0.11.7", features = [] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde_urlencoded = "0.7"
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"
maxminddb = "0.24"
validator = { version = "0.16", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
