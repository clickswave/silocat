<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Apply the saved theme before first paint (avoids flash + dark-on-refresh) -->
		<script>
			try {
				var __theme = localStorage.getItem('theme') || 'dark';
				document.documentElement.setAttribute('data-theme', __theme);
				document.currentScript.insertAdjacentHTML(
					'afterend',
					'<meta name="theme-color" content="' + (__theme === 'light' ? '#fafafa' : '#0b0b0d') + '" />'
				);
			} catch (e) {}
		</script>

		<!-- Icons & PWA -->
		<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
		<link rel="icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Silocat" />

		<!-- Self-hosted fonts -->
		<link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/JetBrainsMono.woff2" as="font" type="font/woff2" crossorigin />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
