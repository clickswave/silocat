      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, status]
              properties:
                id: {type: string}
                status:
                  type: string
                  enum: [open, closed]
      responses:
        '200':
          description: Ticket updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          description: Invalid status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/UnauthorizedOrigin'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    AuthoritySign:
      type: apiKey
      in: header
      name: X-Authority-Sign
      description: |
        Service-to-service secret shared with silocat's own backends (env
        AUTHORITY_SIGN). Required on every request; failure is 401 "Unauthorized
        Origin".
    UserApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        The end user's api_key (users.api_key). Required on protected /user routes in
        addition to X-Authority-Sign. Invalid/missing keys get 401 "Unauthorized";
        banned accounts get 403 "Account banned".

  responses:
    UnauthorizedOrigin:
      description: Missing or invalid X-Authority-Sign header ("Unauthorized Origin").
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    UnauthorizedUser:
      description: Invalid or missing X-Api-Key ("Unauthorized"), or missing X-Authority-Sign ("Unauthorized Origin").
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    AccountBanned:
      description: Account banned. data carries banned, reason and until (null until means permanent).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BanInfo'
    OwnershipMismatch:
      description: The supplied api_key does not match the resource owner.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    NotFound:
      description: Resource not found (or not owned by the given user).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    RateLimited:
      description: Too many requests. data.retry_after is the wait in seconds.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      retry_after:
                        type: integer
                        format: int64
    ServerError:
      description: Internal or database error. errors[] usually carries the underlying error string.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'

  schemas:
    Envelope:
      type: object
      description: |
        Standard response envelope. status mirrors the HTTP status code; errors is a
        list of human-readable strings; data varies per endpoint and is {} or null on
        most errors.
      required: [status, message, errors, data]
      properties:
        status:
          type: integer
        message:
          type: string
        errors:
          type: array
          items:
            type: string
        data:
          description: Endpoint-specific payload.

    BanInfo:
      type: object
      properties:
        banned:
          type: boolean
          const: true
        reason:
          type: ['string', 'null']
        until:
          type: ['string', 'null']
          format: date-time
          description: Null means permanent.

    UserTokenData:
      type: object
      description: The user object returned by auth and profile endpoints. Includes the api_key used for X-Api-Key auth.
      properties:
        id: {type: string}
        email: {type: string}
        profile_image: {type: ['string', 'null']}
        email_verified: {type: boolean}
        password_set:
          type: boolean
          description: False for Google accounts that never set a password.
        username: {type: string}
        api_key: {type: string}
        account_type: {type: string}
        subscription:
          oneOf:
            - $ref: '#/components/schemas/Subscription'
            - type: 'null'
        default_storage_bytes: {type: integer, format: int64}
        country: {type: ['string', 'null']}
        bio: {type: ['string', 'null']}

    Subscription:
      type: object
      properties:
        id: {type: string}
        name:
          type: string
          description: e.g. Pro, Promo.
        additional_space:
          type: integer
          format: int64
          description: Extra bytes on top of default_storage_bytes.
        created_by: {type: string}
        created_on: {type: string, format: date-time}
        expires_on: {type: string, format: date-time}
        invited: {type: boolean}

    StorageStats:
      type: object
      properties:
        total: {type: integer, format: int64}
        used: {type: integer, format: int64}
        free: {type: integer, format: int64}

    File:
      type: object
      description: |
        Full files row. Note this includes owner_api_key and share_password_hash;
        callers should strip them before exposing data to end users.
      properties:
        id: {type: string}
        user_id: {type: ['string', 'null']}
        name: {type: string}
        mime: {type: string}
        size: {type: integer, format: int64}
        encrypted: {type: boolean}
        downloads: {type: integer, format: int64}
        created_on: {type: string, format: date-time}
        total_chunks: {type: integer, format: int64}
        uploaded_chunks: {type: integer, format: int64}
        deleted: {type: boolean}
        sha256_checksum: {type: string}
        blake3_checksum: {type: string}
        public_access: {type: boolean}
        folder_id: {type: ['string', 'null']}
        owner_api_key: {type: ['string', 'null']}
        starred: {type: boolean}
        share_token: {type: ['string', 'null']}
        share_type:
          type: ['string', 'null']
          description: off, public or once (by convention).
        link_downloads: {type: ['integer', 'null'], format: int64}
        link_max_downloads: {type: ['integer', 'null'], format: int64}
        share_expires_at: {type: ['string', 'null'], format: date-time}
        share_password_hash: {type: ['string', 'null']}
        deleted_on: {type: ['string', 'null'], format: date-time}

    Folder:
      type: object
      description: Full folders row (same sensitive-field caveat as File).
      properties:
        id: {type: string}
        name: {type: string}
        user_id: {type: ['string', 'null']}
        parent_id: {type: ['string', 'null']}
        uploaded_as_files: {type: boolean}
        created_on: {type: string, format: date-time}
        updated_on: {type: string, format: date-time}
        owner_api_key: {type: ['string', 'null']}
        starred: {type: boolean}
        share_token: {type: ['string', 'null']}
        share_type: {type: ['string', 'null']}
        link_downloads: {type: ['integer', 'null'], format: int64}
        link_max_downloads: {type: ['integer', 'null'], format: int64}
        share_expires_at: {type: ['string', 'null'], format: date-time}
        share_password_hash: {type: ['string', 'null']}
        deleted: {type: boolean}
        deleted_on: {type: ['string', 'null'], format: date-time}

    Chunk:
      type: object
      description: Full chunks row as returned by /file/create-files (presigned_url is an R2 PUT URL there).
      properties:
        id: {type: string}
        file_id: {type: string}
        chunk_index: {type: integer}
        size: {type: integer, format: int64}
        downloads: {type: integer, format: int64}
        size_on_server: {type: integer, format: int64}
        uploaded: {type: boolean}
        created_on: {type: string, format: date-time}
        presigned_url: {type: ['string', 'null']}
        file_offset: {type: integer, format: int64}
        salt: {type: ['string', 'null']}
        nonce: {type: ['string', 'null']}
        checksum: {type: string}
        uploading: {type: boolean}

    ChunkDownload:
      type: object
      description: Chunk download descriptor; presigned_url is a short-lived R2 GET URL.
      properties:
        id: {type: string}
        index: {type: integer}
        size: {type: integer, format: int64}
        presigned_url: {type: string}
        file_offset: {type: integer, format: int64}
        checksum: {type: string}
        nonce: {type: ['string', 'null']}
        salt: {type: ['string', 'null']}

    PublicSharedFile:
      type: object
      description: Minimal file descriptor exposed through public share links.
      properties:
        id: {type: string}
        name: {type: string}
        size: {type: integer, format: int64}
        mime: {type: string}
        encrypted: {type: boolean}

    ShareSettings:
      type: object
      properties:
        share_token: {type: ['string', 'null']}
        share_type: {type: ['string', 'null']}
        link_downloads: {type: ['integer', 'null'], format: int64}
        link_max_downloads: {type: ['integer', 'null'], format: int64}
        expires_at: {type: ['string', 'null'], format: date-time}
        password_protected: {type: boolean}

    SupportTicket:
      type: object
      properties:
        id: {type: string}
        user_id: {type: ['string', 'null']}
        username: {type: string}
        email: {type: string}
        category: {type: string}
        subject: {type: string}
        message: {type: string}
        is_pro:
          type: boolean
          description: Whether the user had a Pro subscription when the ticket was created.
        status:
          type: string
          enum: [open, closed]
        created_at: {type: string, format: date-time}

    SupportReply:
      type: object
      properties:
        id: {type: string}
        ticket_id: {type: string}
        author_role:
          type: string
          enum: [user, admin]
        author_name: {type: string}
        body: {type: string}
        created_at: {type: string, format: date-time}

    Order:
      type: object
      properties:
        user_id: {type: string}
        created_on: {type: string, format: date-time}
        reference_id:
          type: string
          description: Razorpay order id, or free_<uuid> for zero-amount orders.
        payment_gateway:
          type: string
          description: razorpay or free.
        subscription_name: {type: string}
        subscription_cycle: {type: string}
        additional_space: {type: integer, format: int64}
        currency: {type: string}
        amount:
          type: integer
          format: int64
          description: Minor currency units (cents/paise).
        status:
          type: string
          description: pending or completed.
        details:
          description: Arbitrary JSON (gateway response, promo code).
        transactions:
          type: array
          items: {}

    PromoCode:
      type: object
      required: [code, discount_percentage, duration, active]
      properties:
        code: {type: string}
        discount_percentage: {type: integer}
        duration: {type: string}
        active: {type: boolean}

    SignupPromo:
      type: object
      properties:
        code: {type: string}
        description: {type: string}
        bonus_bytes: {type: integer, format: int64}
        duration_days: {type: ['integer', 'null']}
        max_uses: {type: ['integer', 'null']}
        uses_count: {type: integer}
        active: {type: boolean}
        created_at: {type: string, format: date-time}

    InviteCode:
      type: object
      properties:
        code: {type: string}
        description: {type: string}
        created_on: {type: ['string', 'null'], format: date-time}
        claimed_by: {type: ['string', 'null']}
        benefit: {type: string}
        account_type: {type: string}

    AnonymousUser:
      type: object
      properties:
        api_key: {type: string}
        ip_address: {type: string}
        user_agent: {type: ['string', 'null']}
        geo_location:
          description: MaxMind-derived JSON, may be null.
        created_at: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}
        bandwidth_usage_bytes: {type: integer, format: int64}
        last_reset_stats: {type: string, format: date-time}

    BucketUsage:
      type: object
      properties:
        name: {type: string}
        object_count:
          type: integer
          format: int64
          description: -1 when the R2 query failed.
        total_size_bytes:
          type: integer
          format: int64
          description: -1 when the R2 query failed.

    IpBan:
      type: object
      properties:
        id: {type: string}
        ip: {type: string}
        reason: {type: ['string', 'null']}
        banned_until:
          type: ['string', 'null']
          format: date-time
          description: Null means permanent.
        created_at: {type: string, format: date-time}
        permanent: {type: boolean}
        active: {type: boolean}

    AdminUserRecord:
      type: object
      description: |
        Full users row as returned by GET /admin/users. Contains secrets
        (password_hash, api_key, otp, sessions, pending_email_otp); never expose
        beyond the admin dashboard.
      properties:
        id: {type: string}
        username: {type: string}
        email: {type: string}
        password_hash: {type: string}
        api_key: {type: string}
        created_on: {type: string, format: date-time}
        account_type: {type: string}
        profile_image: {type: ['string', 'null']}
        email_verified: {type: boolean}
        otp: {type: string}
        otp_last_sent_at: {type: ['string', 'null'], format: date-time}
        sessions:
          type: array
          items: {type: string}
        is_restricted: {type: boolean}
        team_id: {type: ['string', 'null']}
        subscription_id: {type: ['string', 'null']}
        default_storage_bytes: {type: integer, format: int64}
        transactions:
          type: array
          items: {}
        country: {type: ['string', 'null']}
        bio: {type: ['string', 'null']}
        username_change_count: {type: integer}
        username_change_window_start: {type: ['string', 'null'], format: date-time}
        is_banned: {type: boolean}
        banned_until: {type: ['string', 'null'], format: date-time}
        ban_reason: {type: ['string', 'null']}
        pending_email: {type: ['string', 'null']}
        pending_email_otp: {type: ['string', 'null']}

    FileKeyOwnershipPayload:
      type: object
      required: [file_id, api_key]
      properties:
        file_id:
          type: string
        api_key:
          type: string
          description: Must match the file's owner_api_key or belong to the user who owns the file.
