          $ref: '#/components/responses/ServerError'

  /admin/db/tables:
    get:
      tags: [admin]
      operationId: adminDbTables
      summary: List user tables with live row estimates
      responses:
        '200':
          description: Tables listed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tables:
                            type: array
                            items:
                              type: object
                              properties:
                                name: {type: string}
                                rows:
                                  type: integer
                                  format: int64
                                  description: Live tuple estimate from pg_stat_user_tables.
        '401':
          $ref: '#/components/responses/UnauthorizedOrigin'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/db/table:
    get:
      tags: [admin]
      operationId: adminDbBrowseTable
      summary: Browse rows of one table
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Rows returned (each row is the jsonb form of the record).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          columns:
                            type: array
                            items: {type: string}
                          rows:
                            type: array
                            items: {type: object}
                          limit: {type: integer, format: int64}
                          offset: {type: integer, format: int64}
        '404':
          description: No such table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/UnauthorizedOrigin'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/db/query:
    post:
      tags: [admin]
      operationId: adminDbQuery
      summary: Run a single read-only SQL statement
      description: |
        SELECT / WITH / VALUES / TABLE only; one statement, no semicolons. Executed
        wrapped in "SELECT to_jsonb(t) FROM (sql) t LIMIT n" inside a read-only
        transaction that is always rolled back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql]
              properties:
                sql: {type: string}
                limit:
                  type: integer
                  default: 50
                  minimum: 1
                  maximum: 1000
      responses:
        '200':
          description: Query OK.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          columns:
                            type: array
                            items: {type: string}
                          rows:
                            type: array
                            items: {type: object}
                          count: {type: integer}
        '400':
          description: Empty query, multiple statements, non read-only statement, or SQL execution error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/UnauthorizedOrigin'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/files:
    get:
      tags: [admin]
      operationId: adminListFiles
      summary: List files (newest first, max 100)
      responses:
        '200':
          description: Files retrieved successfully (narrow projection, not the full file model).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          files:
                            type: array
                            items:
                              type: object
                              properties:
                                id: {type: string}
                                user_id: {type: ['string', 'null']}
                                name: {type: string}
                                mime: {type: string}
                                size: {type: integer, format: int64}
                                encrypted: {type: boolean}
                                created_on: {type: string, format: date-time}
                                downloads: {type: integer, format: int64}
                                public_access: {type: boolean}
        '401':
          $ref: '#/components/responses/UnauthorizedOrigin'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/files/{id}/download:
    get:
      tags: [admin]
      operationId: adminDownloadFile
      summary: Reassemble and download a file's bytes (max 200 MiB, unencrypted only)
      description: |
        Success streams the concatenated chunk bytes with the file's own Content-Type
        and a Content-Disposition attachment header; this is the only endpoint that
        does not return the JSON envelope on success. Storage-layer failures respond
        with HTTP 500 but "status": 502 in the body (unmapped code).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Raw file bytes as an attachment.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          description: File is end-to-end encrypted; the server cannot produce a decrypted download.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: File too large for the admin panel (over 200 MiB).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/UnauthorizedOrigin'
        '500':
          description: Database error, or storage error (body carries "status" 502).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'

