                            type: array
                            items:
                              $ref: '#/components/schemas/SupportReply'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/UnauthorizedOrigin'
        '500':
          $ref: '#/components/responses/ServerError'

  /admin/support-tickets/{id}/reply:
    post:
      tags: [admin]
      operationId: adminReplySupportTicket
      summary: Add an admin reply (best-effort email notification to the user)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                author_name:
                  type: ['string', 'null']
