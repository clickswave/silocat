                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          stats:
                            type: object
                            properties:
                              total_users: {type: integer, format: int64}
                              total_files: {type: integer, format: int64}
                              total_storage_bytes: {type: integer, format: int64}
                              total_subscriptions: {type: integer, format: int64}
                              active_anon_users:
                                type: integer
                                format: int64
                                description: Anonymous users seen in the last 24 hours.
        '401':
          $ref: '#/components/responses/UnauthorizedOrigin'

  /admin/cloudflare:
    get:
      tags: [admin]
