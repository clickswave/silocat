      responses:
        '200':
          description: Cloudflare usage retrieved successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          shadow:
                            $ref: '#/components/schemas/BucketUsage'
                          sanctum:
                            $ref: '#/components/schemas/BucketUsage'
        '401':
          $ref: '#/components/responses/UnauthorizedOrigin'

  /admin/early-access:
    get:
      tags: [admin]
      operationId: adminListEarlyAccess
      summary: List early access requests (newest first, unbounded)
      responses:
        '200':
          description: Requests fetched. Unlike other endpoints, data is a bare array.
          content:
