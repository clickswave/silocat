name: Bug report
description: Something behaves differently than it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Email security@silo.cat.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Upload ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Where
      options:
        - silo.cat (hosted)
        - Self-hosted (compose)
        - Local development
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`, if self-hosted.
  - type: textarea
    id: context
    attributes:
      label: Browser, OS, logs
      description: Anything else that narrows it down. Redact tokens and API keys.
