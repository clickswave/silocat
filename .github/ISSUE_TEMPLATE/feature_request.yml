name: Feature request
description: Suggest something Silocat should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. A rough shape is fine.
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This does not require the server to see plaintext, keys or passwords
          required: true
