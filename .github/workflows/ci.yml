name: CI

on:
  push:
    branches: [main]
  pull_request:

# Gates are the things that mean "this is broken": the frontend must build and
# the backend must compile. Lint and type diagnostics run too, but do not fail
# the build: this is a JavaScript codebase with `checkJs` on, so svelte-check
# reports a large backlog of pre-existing implicit-any findings that predate any
# given PR. Failing on those would make CI permanently red and therefore ignored.
jobs:
  web:
    name: web_server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web_server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/web_server/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Type diagnostics (report only)
        continue-on-error: true
        run: npx svelte-kit sync && npx svelte-check --tsconfig ./jsconfig.json

  api:
    name: api_switch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api_switch
    env:
      # Compile against the checked-in query cache so CI needs no database.
      # A failure here means someone changed SQL without running
      # `cargo sqlx prepare`.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/api_switch

      - name: Check
        run: cargo check --all-targets

      - name: Clippy (report only)
        continue-on-error: true
        run: cargo clippy --all-targets

  migrations:
    name: migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: silocat
          POSTGRES_PASSWORD: silocat
          POSTGRES_DB: silocat
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls
      # Migrations run on api_switch startup, so one that fails on a clean
      # database takes the service down on deploy.
      - name: Run migrations against a clean database
        working-directory: services/api_switch
        env:
          DATABASE_URL: postgres://silocat:silocat@localhost:5432/silocat
        run: sqlx migrate run
