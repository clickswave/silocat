services:
  # -----------------------------------------
  # - WEB SERVER (SVELTEKIT)
  # -----------------------------------------
  sc_web_server:
    container_name: sc_web_server
    # restart: always
    tty: true
    command: sh -c "npm i --verbose && npm run dev"

    build:
      context: ../services/web_server
      dockerfile: Dockerfile

    volumes:
      - ../services/web_server:/root/codebase:rw

    ports:
      - "12001:12001"

    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL}
      PUBLIC_TURNSTILE_KEY: ${PUBLIC_TURNSTILE_KEY}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      OAUTH_CALLBACK_BASE_URI: ${OAUTH_CALLBACK_BASE_URI}
      OAUTH_ID_GOOGLE: ${OAUTH_ID_GOOGLE}
      OAUTH_SECRET_GOOGLE: ${OAUTH_SECRET_GOOGLE}
      INFRA_COMMUNICATION_SECRET: ${INFRA_COMMUNICATION_SECRET}
      INFRA_COMMUNICATION_SECRET_HEADER: ${INFRA_COMMUNICATION_SECRET_HEADER}
      RAZORPAY_ID: ${RAZORPAY_ID}
      RAZORPAY_SECRET: ${RAZORPAY_SECRET}

    depends_on:
      - sc_api_switch

    networks:
      - clickswave_network

  # -----------------------------------------
  # - API SWITCH (AXUM)
  # DB is core's `silocat` database (DATABASE_URL points at core_postgres).
  # api_switch runs its own sqlx migrations against it.
  # -----------------------------------------
  sc_api_switch:
    container_name: sc_api_switch
    # restart: always
    tty: true
    command: >
      sh -c "echo $DATABASE_URL && sleep 10 && cargo sqlx migrate run && cargo watch -x run"

    build:
      context: ../services/api_switch
      dockerfile: Dockerfile

    environment:
      OAUTH_ID_GOOGLE: ${OAUTH_ID_GOOGLE}
      OAUTH_SECRET_GOOGLE: ${OAUTH_SECRET_GOOGLE}
      DATABASE_URL: ${POSTGRES_DATABASE_URL}
      SMTP_ADDRESS: ${SMTP_ADDRESS}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      RAZORPAY_ID: ${RAZORPAY_ID}
      RAZORPAY_SECRET: ${RAZORPAY_SECRET}
      INFRA_COMMUNICATION_SECRET: ${INFRA_COMMUNICATION_SECRET}
      INFRA_COMMUNICATION_SECRET_HEADER: ${INFRA_COMMUNICATION_SECRET_HEADER}
      ADMIN_COMMUNICATION_SECRET: ${ADMIN_COMMUNICATION_SECRET}
      ADMIN_COMMUNICATION_SECRET_HEADER: ${ADMIN_COMMUNICATION_SECRET_HEADER}
      API_KEY_ENC_KEY: ${API_KEY_ENC_KEY}
      EMAIL_USE_SES_TEMPLATES: ${EMAIL_USE_SES_TEMPLATES}
      EMAIL_COOLDOWN_SECS: ${EMAIL_COOLDOWN_SECS:-60}
      EMAIL_MAX_PER_HOUR: ${EMAIL_MAX_PER_HOUR:-5}
      EMAIL_MAX_PER_DAY: ${EMAIL_MAX_PER_DAY:-20}
      EMAIL_GLOBAL_MAX_PER_DAY: ${EMAIL_GLOBAL_MAX_PER_DAY:-2000}
      AWS_REGION: ${AWS_REGION}
      SES_TEMPLATE_PREFIX: ${SES_TEMPLATE_PREFIX}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      CF_R2_SHADOW_API_URL: ${CF_R2_SHADOW_API_URL}
      CF_R2_SANCTUM_API_URL: ${CF_R2_SANCTUM_API_URL}
      CF_R2_SHADOW_ACCESS_ID: ${CF_R2_SHADOW_ACCESS_ID}
      CF_R2_SANCTUM_ACCESS_ID: ${CF_R2_SANCTUM_ACCESS_ID}
      CF_R2_SHADOW_ACCESS_SECRET: ${CF_R2_SHADOW_ACCESS_SECRET}
      CF_R2_SANCTUM_ACCESS_SECRET: ${CF_R2_SANCTUM_ACCESS_SECRET}
      CF_R2_SHADOW_BUCKET: ${CF_R2_SHADOW_BUCKET}
      CF_R2_SANCTUM_BUCKET: ${CF_R2_SANCTUM_BUCKET}
      CF_R2_REGION: ${CF_R2_REGION}
      CF_R2_DP_API_URL: ${CF_R2_DP_API_URL}
      CF_R2_DP_BUCKET: ${CF_R2_DP_BUCKET}
      CF_R2_DP_ACCESS_ID: ${CF_R2_DP_ACCESS_ID}
      CF_R2_DP_ACCESS_SECRET: ${CF_R2_DP_ACCESS_SECRET}
      GEOLITE2_DB_PATH: /root/codebase/GeoLite2-City.mmdb
      APP_ENV: ${APP_ENV}

    volumes:
      - ../services/api_switch:/root/codebase:rw

    ports:
      - "31337:31337"

    networks:
      - clickswave_network

  # -----------------------------------------
  # - WATCHCAT SCHEDULER (GC + future scheduled jobs)
  # -----------------------------------------
  sc_watchcat:
    container_name: sc_watchcat
    tty: true
    command: >
      sh -c "sleep 12 && cargo watch -x run"

    build:
      context: ../services/api_switch
      dockerfile: Dockerfile

    environment:
      WATCHCAT_MODE: "true"
      API_KEY_ENC_KEY: ${API_KEY_ENC_KEY}
      EMAIL_USE_SES_TEMPLATES: ${EMAIL_USE_SES_TEMPLATES}
      EMAIL_COOLDOWN_SECS: ${EMAIL_COOLDOWN_SECS:-60}
      EMAIL_MAX_PER_HOUR: ${EMAIL_MAX_PER_HOUR:-5}
      EMAIL_MAX_PER_DAY: ${EMAIL_MAX_PER_DAY:-20}
      EMAIL_GLOBAL_MAX_PER_DAY: ${EMAIL_GLOBAL_MAX_PER_DAY:-2000}
      AWS_REGION: ${AWS_REGION}
      SES_TEMPLATE_PREFIX: ${SES_TEMPLATE_PREFIX}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      WATCHCAT_SHADOW_TTL_DAYS: "7"
      WATCHCAT_ORDER_TTL_DAYS: "7"
      CARGO_TARGET_DIR: /tmp/wc-target
      DATABASE_URL: ${POSTGRES_DATABASE_URL}
      CF_R2_SHADOW_API_URL: ${CF_R2_SHADOW_API_URL}
      CF_R2_SANCTUM_API_URL: ${CF_R2_SANCTUM_API_URL}
      CF_R2_SHADOW_ACCESS_ID: ${CF_R2_SHADOW_ACCESS_ID}
      CF_R2_SANCTUM_ACCESS_ID: ${CF_R2_SANCTUM_ACCESS_ID}
      CF_R2_SHADOW_ACCESS_SECRET: ${CF_R2_SHADOW_ACCESS_SECRET}
      CF_R2_SANCTUM_ACCESS_SECRET: ${CF_R2_SANCTUM_ACCESS_SECRET}
      CF_R2_SHADOW_BUCKET: ${CF_R2_SHADOW_BUCKET}
      CF_R2_SANCTUM_BUCKET: ${CF_R2_SANCTUM_BUCKET}
      CF_R2_REGION: ${CF_R2_REGION}
      CF_R2_DP_API_URL: ${CF_R2_DP_API_URL}
      CF_R2_DP_BUCKET: ${CF_R2_DP_BUCKET}
      CF_R2_DP_ACCESS_ID: ${CF_R2_DP_ACCESS_ID}
      CF_R2_DP_ACCESS_SECRET: ${CF_R2_DP_ACCESS_SECRET}

    volumes:
      - ../services/api_switch:/root/codebase:rw

    depends_on:
      - sc_api_switch

    networks:
      - clickswave_network

  # -----------------------------------------
  # - NGINX PROXY
  # -----------------------------------------
  sc_nginx:
    container_name: sc_nginx
    restart: always
    tty: true

    build:
      context: ../services/nginx
      dockerfile: Dockerfile

    ports:
      - "8080:80"

    depends_on:
      - sc_api_switch

    networks:
      - clickswave_network

networks:
  clickswave_network:
    external: true
